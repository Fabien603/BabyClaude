# BabyClaude Configuration
# Based on Qwen2.5-3B-Instruct with LoRA fine-tuning

model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  type: "causal_lm"
  torch_dtype: "bfloat16"  # ou float16 si bfloat16 pas supporté
  device_map: "auto"

# LoRA Configuration (Parameter-Efficient Fine-Tuning)
# Increased for better factual learning
lora:
  r: 64  # Increased from 16 - 4x more capacity for learning facts
  lora_alpha: 128  # Scaled with r
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

# Training Configuration
training:
  output_dir: "./checkpoints"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4  # Batch effectif = 4*4 = 16
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_steps: 100
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  fp16: false
  bf16: true  # Meilleur que fp16 si supporté
  optim: "paged_adamw_8bit"  # Économe en mémoire
  gradient_checkpointing: true
  max_grad_norm: 0.3

# Generation Configuration
generation:
  max_new_tokens: 256  # Reduced to avoid long hallucinations
  temperature: 0.7
  top_p: 0.9
  top_k: 40  # Slightly reduced for more focused generation
  repetition_penalty: 1.15  # Increased to reduce repetition
  do_sample: true

# Data Configuration
data:
  train_file: "data/train.jsonl"
  eval_file: "data/eval.jsonl"
  max_seq_length: 512
  preprocessing_num_workers: 4

# Capabilities to prioritize (FR/EN bilingual, code, reasoning)
capabilities:
  languages: ["fr", "en"]
  domains: ["code", "reasoning", "instruction_following", "math"]
